<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title data-i18n="documentTitle"></title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/portal-empleado/portal.css" />
    <link rel="stylesheet" href="/portal-empleado/portal-componentes.css" />
    <link rel="stylesheet" href="./organizacion.css" />
  </head>
  <body class="portal-empleado-app">
    <main class="org-shell" id="organizacion" tabindex="-1">
      <div class="org-top">
        <div>
          <div class="org-kicker" data-i18n="eyebrow"></div>
          <h1 data-i18n="title"></h1>
        </div>
        <div class="org-top-actions">
          <details class="org-help">
            <summary data-i18n="helpOpen"></summary>
            <div class="org-help-content">
              <p data-i18n="intro"></p>
              <strong data-i18n="noticeTitle"></strong>
              <p data-i18n="notice"></p>
              <p id="provenance"></p>
              <p data-i18n="note"></p>
              <p data-i18n="editorHelper"></p>
              <p data-i18n="importHelp"></p>
              <dl class="org-meta">
                <div><dt data-i18n="catalogId"></dt><dd id="catalog-id">—</dd></div>
                <div><dt data-i18n="version"></dt><dd id="catalog-version">—</dd></div>
                <div><dt data-i18n="fingerprint"></dt><dd id="catalog-hash">—</dd></div>
                <div><dt data-i18n="status"></dt><dd id="catalog-status">—</dd></div>
              </dl>
            </div>
          </details>
          <a class="org-back" href="/portal-empleado/" data-i18n="back"></a>
        </div>
      </div>
      <nav class="org-tabs" role="tablist" data-i18n-label="tabsLabel">
        <button type="button" role="tab" id="tab-history" class="org-tab" aria-controls="history-panel" aria-selected="true" data-i18n="historyTab"></button>
        <button type="button" role="tab" id="tab-import" class="org-tab" aria-controls="import-panel" aria-selected="false" data-i18n="importTab" tabindex="-1"></button>
        <button type="button" role="tab" id="tab-catalog" class="org-tab" aria-controls="catalog-panel" aria-selected="false" data-i18n="catalogTab" tabindex="-1"></button>
      </nav>
      <section class="org-panel org-history" role="tabpanel" id="history-panel" aria-labelledby="tab-history">
        <div class="org-panel-heading">
          <h2 id="history-title" data-i18n="historyTitle"></h2>
          <span class="org-pill" id="history-access-state" aria-live="polite"></span>
        </div>
        <div class="org-panel-body">
          <form id="history-form" class="org-history-form">
            <label><span data-i18n="historyUnit"></span><select id="history-unit" disabled><option value="" data-i18n="historyChooseUnit"></option></select></label>
            <label><span data-i18n="historyValidDate"></span><input id="history-valid-date" type="text" inputmode="numeric" autocomplete="off" maxlength="10" required data-i18n-placeholder="historyDateFormat" /></label>
            <label><span data-i18n="historyKnownAt"></span><input id="history-known-at" type="text" inputmode="numeric" autocomplete="off" maxlength="16" required data-i18n-placeholder="historyDateTimeFormat" /></label>
            <label><span data-i18n="historyVersionRPT"></span><input id="history-version-rpt" type="text" maxlength="160" autocomplete="off" /></label>
            <label><span data-i18n="historyVersionPlantilla"></span><input id="history-version-plantilla" type="text" maxlength="160" autocomplete="off" /></label>
            <button type="submit" id="history-search" disabled data-i18n="historySearch"></button>
          </form>
          <div id="history-state" class="org-state" role="status" aria-live="polite"></div>
          <div id="history-results" class="org-history-results" hidden>
            <div class="org-history-scope" data-i18n="historyPageScope"></div>
            <div class="org-history-summary">
              <div class="org-history-kpis" id="history-coverage"></div>
              <div class="org-history-meta" id="history-meta"></div>
            </div>
            <div class="org-history-list-head">
              <label for="history-kind" data-i18n="historyKind"></label>
              <select id="history-kind">
                <option value="unidades" data-i18n="historyUnits"></option>
                <option value="puestos_tipo" data-i18n="historyTypes"></option>
                <option value="dotaciones" data-i18n="historyAllocations"></option>
                <option value="plazas" data-i18n="historyPlazas"></option>
                <option value="puestos_individuales" data-i18n="historyPosts"></option>
                <option value="vinculos" data-i18n="historyLinks"></option>
              </select>
              <span id="history-count" aria-live="polite"></span>
            </div>
            <div id="history-table-wrap" class="org-table-wrap" tabindex="0">
              <table><caption id="history-caption"></caption><thead id="history-head"></thead><tbody id="history-rows"></tbody></table>
            </div>
            <div class="org-history-footer"><button type="button" id="history-more" class="org-secondary" hidden data-i18n="historyMore"></button></div>
          </div>
        </div>
      </section>
      <section class="org-panel org-import" role="tabpanel" id="import-panel" aria-labelledby="tab-import" hidden>
        <div class="org-panel-heading">
          <h2 data-i18n="importTitle"></h2>
          <span class="org-pill" id="import-stage" aria-live="polite"></span>
        </div>
        <div class="org-import-body">
          <section class="org-import-step" aria-labelledby="import-prepare-title">
            <div class="org-step-heading"><span class="org-step-number" aria-hidden="true">1</span><h3 id="import-prepare-title" data-i18n="importPrepareTitle"></h3></div>
            <div class="org-import-controls">
              <input id="import-file" type="file" accept=".json,application/json" hidden />
              <button type="button" id="choose-import" class="org-secondary" data-i18n="importChoosePackage"></button>
              <span id="import-file-name" class="org-file-name" aria-live="polite"></span>
            </div>
            <div id="import-preview" class="org-import-preview" hidden></div>
            <div class="org-actions"><button type="button" id="import-prepare" disabled data-i18n="importPrepareAction"></button></div>
          </section>
          <section class="org-import-step" aria-labelledby="import-conciliate-title">
            <div class="org-step-heading"><span class="org-step-number" aria-hidden="true">2</span><h3 id="import-conciliate-title" data-i18n="importConciliateTitle"></h3></div>
            <div class="org-import-controls">
              <input id="decisions-file" type="file" accept=".json,application/json" hidden />
              <button type="button" id="choose-decisions" class="org-secondary" disabled data-i18n="importChooseDecisions"></button>
              <span id="decisions-file-name" class="org-file-name" aria-live="polite"></span>
            </div>
            <div id="decisions-preview" class="org-import-preview" hidden></div>
            <div class="org-actions"><button type="button" id="import-conciliate" disabled data-i18n="importConciliateAction"></button></div>
          </section>
          <section class="org-import-step" aria-labelledby="import-publish-title">
            <div class="org-step-heading"><span class="org-step-number" aria-hidden="true">3</span><h3 id="import-publish-title" data-i18n="importPublishTitle"></h3></div>
            <div class="org-actions"><button type="button" id="import-publish" disabled aria-describedby="import-publish-reason" data-i18n="importPublishAction"></button></div>
            <p id="import-publish-reason" class="org-import-limit" data-i18n="importPublishBlocked"></p>
          </section>
          <div id="import-review" class="org-import-review" hidden></div>
          <div id="import-state" class="org-state" role="status" aria-live="polite"></div>
          <div id="import-receipts" class="org-import-receipts" aria-live="polite"></div>
        </div>
      </section>
      <section class="org-panel" role="tabpanel" id="catalog-panel" aria-labelledby="tab-catalog" hidden>
        <div class="org-panel-heading">
          <h2 id="table-title" data-i18n="tableTitle"></h2>
          <button type="button" id="new-unit" data-i18n="newUnit" hidden></button>
        </div>
        <div class="org-toolbar">
          <div>
            <label for="filter-text" data-i18n="filterText"></label
            ><input id="filter-text" type="search" autocomplete="off" />
          </div>
          <div>
            <label for="filter-type" data-i18n="filterType"></label
            ><select id="filter-type">
              <option value="" data-i18n="allTypes"></option>
              <option value="delegacion" data-i18n="delegacion"></option>
              <option value="centro" data-i18n="centro"></option>
              <option
                value="puesto_responsabilidad"
                data-i18n="puesto"
              ></option>
            </select>
          </div>
          <div class="org-count" id="result-count" aria-live="polite"></div>
        </div>
        <div
          id="state"
          class="org-state"
          role="status"
          aria-live="polite"
        ></div>
        <div class="org-table-wrap" id="table-wrap" tabindex="0" hidden>
          <table>
            <caption data-i18n="tableCaption"></caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="type"></th>
                <th scope="col" data-i18n="code"></th>
                <th scope="col" data-i18n="name"></th>
                <th scope="col" data-i18n="adscription"></th>
                <th scope="col" data-i18n="page"></th>
                <th scope="col" data-i18n="actions"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="org-source">
          <span data-i18n="sourceLabel"></span> <span id="source-ref"></span> ·
          <a
            id="source-link"
            target="_blank"
            rel="noreferrer noopener"
            data-i18n="sourceLink"
          ></a>
        </p>
      </section>
      <section
        class="org-panel org-editor"
        id="editor"
        aria-labelledby="editor-title"
        hidden
      >
        <h2 id="editor-title" data-i18n="editorTitle"></h2>
        <form id="unit-form">
          <input id="unit-key" type="hidden" />
          <div class="org-form-grid">
            <div>
              <label for="unit-label" data-i18n="label"></label
              ><input id="unit-label" required maxlength="240" />
            </div>
            <div>
              <label for="unit-type" data-i18n="type"></label
              ><select id="unit-type" required>
                <option value="delegacion" data-i18n="delegacion"></option>
                <option value="centro" data-i18n="centro"></option>
                <option
                  value="puesto_responsabilidad"
                  data-i18n="puesto"
                ></option>
              </select>
            </div>
            <div>
              <label for="unit-parent" data-i18n="parent"></label
              ><select id="unit-parent">
                <option value="" data-i18n="noParent"></option>
              </select>
            </div>
            <div>
              <label for="unit-reason" data-i18n="reason"></label
              ><textarea
                id="unit-reason"
                required
                maxlength="1000"
                rows="3"
              ></textarea>
            </div>
          </div>
          <div id="review" class="org-review" hidden></div>
          <div
            id="save-state"
            class="org-state"
            role="status"
            aria-live="polite"
            hidden
          ></div>
          <div class="org-actions">
            <button
              type="button"
              id="cancel-edit"
              class="org-secondary"
              data-i18n="cancel"
            ></button
            ><button
              type="submit"
              id="review-submit"
              data-i18n="review"
            ></button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="./organizacion.js?v=20260925-b2-ci1"></script>
  </body>
</html>
