<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Petición del centro · Portal del Empleado</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/portal-empleado/portal.css">
    <link rel="stylesheet" href="/portal-empleado/portal-componentes.css">
    <link rel="stylesheet" href="/portal-empleado/modulos/contratacion-temporal/contratacion-temporal.css">
    <link rel="stylesheet" href="/portal-empleado/peticiones-centro/peticiones-centro.css">
  </head>
  <body class="portal-empleado-app peticiones-centro-app">
    <a class="salto-contenido" href="#contenido-principal">Saltar al contenido principal</a>
    <header class="pc-barra">
      <a href="/portal-empleado/" class="pc-marca">Portal del Empleado</a>
      <span>Gestión de Recursos Humanos</span>
      <button type="button" class="pc-boton-ayuda" id="pc-ayuda-abrir" aria-haspopup="dialog" aria-controls="pc-ayuda" aria-label="Ayuda"><span aria-hidden="true">?</span></button>
    </header>
    <dialog id="pc-ayuda" class="pc-ayuda" aria-labelledby="pc-ayuda-titulo" aria-describedby="pc-ayuda-contenido">
      <h2 id="pc-ayuda-titulo" data-i18n-ayuda="pc_ayuda_titulo"></h2>
      <div id="pc-ayuda-contenido">
        <h3 data-i18n-ayuda="pc_ayuda_certificado_titulo"></h3>
        <p data-i18n-ayuda="pc_ayuda_certificado"></p>
        <h3 data-i18n-ayuda="pc_ayuda_registro_titulo"></h3>
        <p data-i18n-ayuda="pc_ayuda_registro"></p>
        <h3 data-i18n-ayuda="pc_ayuda_despues_titulo"></h3>
        <p data-i18n-ayuda="pc_ayuda_despues"></p>
        <h3 data-i18n-ayuda-incorporacion="ayuda_titulo"></h3>
        <p data-i18n-ayuda-incorporacion="ayuda"></p>
        <h3 data-i18n-ayuda-cancelacion="ayuda_titulo"></h3>
        <p data-i18n-ayuda-cancelacion="ayuda"></p>
      </div>
      <div class="pc-acciones"><button type="button" class="boton-secundario" id="pc-ayuda-cerrar" data-i18n-ayuda="pc_ayuda_cerrar"></button></div>
    </dialog>
    <main id="contenido-principal" class="pc-contenido" tabindex="-1">
      <div id="aplicacion" aria-live="off"></div>
      <div id="incorporaciones-centro" class="pc-incorporaciones" hidden></div>
      <div id="cancelaciones-centro" class="pc-incorporaciones" hidden></div>
    </main>
    <footer class="pc-pie">Diputación de Granada</footer>
    <script type="module" src="./peticiones-centro.js"></script>
    <script type="module" src="./incorporaciones-centro.js?v=20260926-huecos-rrhh-v1"></script>
    <script type="module" src="./cancelaciones-centro.js?v=20260926-huecos-rrhh-v1"></script>
  </body>
</html>
