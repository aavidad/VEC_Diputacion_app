<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title></title>
  <link rel="stylesheet" href="/portal-empleado/portal.css?v=20261005-shell-overflow-clip-v1">
  <link rel="stylesheet" href="/portal-empleado/portal-componentes.css?v=20260930-codexf-temas-v2">
  <link rel="stylesheet" href="/portal-empleado/portal-patrones.css?v=20261003-s2-consulta-v1">
  <link rel="stylesheet" href="/portal-empleado/portal-flujos.css?v=20261003-s2-consulta-v1">
  <link rel="stylesheet" href="./preparacion-bases.css?v=20261003-s2-consulta-v3">
</head>
<body class="portal-empleado-app modulo-preparacion-bases">
  <a class="salto-contenido" href="#contenido-principal" data-texto="saltar"></a>
  <div class="portal-empleado-shell">
    <aside class="portal-lateral">
      <div class="marca-portal"><strong data-texto="portal"></strong><p data-texto="organizacion"></p></div>
      <nav class="navegacion-modulos" data-aria="navegacion"><a class="enlace-lateral" href="./index.html" aria-current="page"><span class="indicador-menu" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg></span><span data-texto="titulo"></span></a></nav>
    </aside>
    <div class="portal-superficie">
      <header class="cabecera-portal">
        <div class="contexto-cabecera"><div class="migas" data-texto="contexto"></div><h1 data-texto="titulo"></h1></div>
        <div class="acciones-cabecera">
          <label class="selector-idioma"><span data-texto="idioma"></span><select id="bases-idioma"></select></label>
          <button type="button" class="boton-secundario" id="bases-ayuda" data-texto="ayuda_signo" data-aria="ayuda" aria-expanded="false" aria-controls="bases-ayuda-contenido"></button>
        </div>
      </header>
      <main id="contenido-principal" class="contenido-portal" tabindex="-1"><div id="espacio-trabajo"><div class="pila">
        <section id="bases-ayuda-contenido" class="panel" hidden><header class="cabecera-panel"><h2 data-texto="ayuda"></h2></header><div class="cuerpo-panel"><p data-texto="ayuda_texto"></p></div></section>
        <section class="panel"><header class="cabecera-panel"><h2 data-texto="consulta_titulo"></h2></header><div class="cuerpo-panel pila">
          <p data-texto="consulta_limite"></p>
          <form id="bases-consulta" class="pila" novalidate>
            <label class="campo" for="bases-referencia"><span data-texto="consulta_referencia"></span><input id="bases-referencia" name="preparacion_ref" type="text" maxlength="180" required aria-describedby="bases-consulta-pista bases-referencia-error bases-estado"><span id="bases-referencia-error" class="bases-error-campo" hidden></span></label>
            <p id="bases-consulta-pista" class="texto-secundario" data-texto="consulta_pista"></p>
            <label class="campo" for="bases-modo"><span data-texto="consulta_modo"></span><select id="bases-modo"><option value="actual" data-texto="consulta_actual"></option><option value="exacta" data-texto="consulta_exacta"></option></select></label>
            <div id="bases-exacta" class="pila" hidden>
              <label class="campo" for="bases-revision"><span data-texto="consulta_revision"></span><input id="bases-revision" type="number" min="1" max="1000000" step="1" aria-describedby="bases-revision-error bases-estado"><span id="bases-revision-error" class="bases-error-campo" hidden></span></label>
              <label class="campo" for="bases-huella"><span data-texto="consulta_huella"></span><input id="bases-huella" type="text" maxlength="64" aria-describedby="bases-huella-error bases-estado"><span id="bases-huella-error" class="bases-error-campo" hidden></span></label>
            </div>
            <div class="acciones-vista"><button id="bases-consultar" type="submit" class="boton-primario" data-texto="consultar" disabled></button><button id="bases-cancelar" type="button" class="boton-secundario" data-texto="cancelar" disabled></button></div>
          </form>
        </div></section>
        <section class="panel"><header class="cabecera-panel"><h2 data-texto="abrir"></h2></header><div class="cuerpo-panel">
          <p data-texto="limite"></p>
          <label class="campo" for="bases-archivo"><span data-texto="archivo"></span><input id="bases-archivo" type="file" accept=".json,application/json" aria-describedby="bases-pista bases-estado"></label>
          <p id="bases-pista" class="texto-secundario" data-texto="archivo_pista"></p>
        </div></section>
        <section class="panel"><header class="cabecera-panel"><h2 data-texto="material_actual"></h2></header><div class="cuerpo-panel">
          <p id="bases-estado" role="status" aria-live="polite" data-texto="vacio"></p>
          <div class="acciones-vista"><button id="bases-descargar" type="button" class="boton-primario" data-texto="descargar" disabled></button><button id="bases-cerrar" type="button" class="boton-secundario" data-texto="cerrar" disabled></button></div>
        </div></section>
        <div id="bases-resultados" class="pila"></div>
      </div></div></main>
    </div>
  </div>
  <script type="module" src="./entrada.js?v=20261003-s2-consulta-v2"></script>
</body>
</html>
