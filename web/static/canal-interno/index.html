<!doctype html>
<html lang="es" data-tema="institucional">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title></title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/comun/tema-vec.css">
  <link rel="stylesheet" href="/canal-interno/canal-interno.css">
  <script type="module" src="/canal-interno/canal-interno.js"></script>
</head>
<body>
  <a class="salto" href="#contenido" data-t="saltar"></a>
  <div class="franja" aria-hidden="true"></div>
  <header class="cabecera">
    <a class="marca" href="/" data-sin-texto="marca"><img src="/assets/logo-diputacion-granada.svg" alt="" width="190" height="64"><span data-t="marca"></span></a>
    <div class="cabecera-acciones">
      <label for="idioma" data-t="idioma"></label><select id="idioma"></select>
      <button id="ayuda-boton" type="button" aria-expanded="false" aria-controls="ayuda" aria-label="?">?</button>
    </div>
  </header>
  <main id="contenido" tabindex="-1">
    <div id="estado" role="status" aria-live="polite"></div>
    <div id="pagina" hidden>
      <p class="miga" data-t="zona"></p>
      <h1 data-t="titulo"></h1>
      <p class="entradilla" data-t="intro"></p>
      <section class="panel destacado" aria-labelledby="accion-titulo">
        <div class="panel-cabecera"><h2 id="accion-titulo" data-t="accion_titulo"></h2></div>
        <div class="panel-cuerpo">
          <p data-t="accion_descripcion"></p>
          <a id="canal" class="accion" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-t="accion_enlace"></a>
          <p class="nota" data-t="salida"></p>
        </div>
      </section>
      <div class="rejilla">
        <section class="panel" aria-labelledby="ambito-titulo">
          <div class="panel-cabecera"><h2 id="ambito-titulo" data-t="ambito_titulo"></h2></div>
          <div class="panel-cuerpo"><p data-t="ambito_que"></p><p data-t="ambito_quien"></p><p data-t="ambito_duda"></p><p data-t="ambito_acoso"></p><p data-t="ambito_externo"></p></div>
        </section>
        <section class="panel" aria-labelledby="privacidad-titulo">
          <div class="panel-cabecera"><h2 id="privacidad-titulo" data-t="privacidad_titulo"></h2></div>
          <div class="panel-cuerpo"><p data-t="privacidad_anonima"></p><p data-t="privacidad_sin_datos"></p></div>
        </section>
      </div>
      <section class="panel" aria-labelledby="normas-titulo">
        <div class="panel-cabecera"><h2 id="normas-titulo" data-t="normas_titulo"></h2></div>
        <div class="panel-cuerpo"><ul class="enlaces">
          <li><a id="institucional" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-t="institucional"></a></li>
          <li><a id="estrategia" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-t="estrategia"></a><span data-t="estrategia_ref"></span></li>
          <li><a id="reglamento" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-t="reglamento"></a><span data-t="reglamento_ref"></span></li>
          <li><a id="ley" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-t="ley"></a><span data-t="ley_ref"></span></li>
        </ul></div>
      </section>
    </div>
    <section id="ayuda" class="panel ayuda" hidden aria-labelledby="ayuda-titulo">
      <div class="panel-cabecera"><h2 id="ayuda-titulo" tabindex="-1" data-t="ayuda_titulo"></h2></div>
      <div class="panel-cuerpo"><p data-t="ayuda_texto"></p><p data-t="ayuda_problema"></p></div>
    </section>
  </main>
  <footer data-t="pie"></footer>
</body>
</html>
