services:
  osrm-extract:
    image: ${OSRM_IMAGE:-osrm/osrm-backend:latest}
    profiles: ["build"]
    working_dir: /data
    entrypoint: ["/bin/sh", "/opt/vec/iniciar_osrm.sh"]
    environment:
      OSRM_DATA_BASENAME: ${OSRM_DATA_BASENAME:-granada-buffer}
    volumes:
      - ./data:/data
      - ./iniciar_osrm.sh:/opt/vec/iniciar_osrm.sh:ro
    command: ["extraer"]

  osrm-partition:
    image: ${OSRM_IMAGE:-osrm/osrm-backend:latest}
    profiles: ["build"]
    working_dir: /data
    entrypoint: ["/bin/sh", "/opt/vec/iniciar_osrm.sh"]
    environment:
      OSRM_DATA_BASENAME: ${OSRM_DATA_BASENAME:-granada-buffer}
    volumes:
      - ./data:/data
      - ./iniciar_osrm.sh:/opt/vec/iniciar_osrm.sh:ro
    command: ["particionar"]
    depends_on:
      osrm-extract:
        condition: service_completed_successfully

  osrm-customize:
    image: ${OSRM_IMAGE:-osrm/osrm-backend:latest}
    profiles: ["build"]
    working_dir: /data
    entrypoint: ["/bin/sh", "/opt/vec/iniciar_osrm.sh"]
    environment:
      OSRM_DATA_BASENAME: ${OSRM_DATA_BASENAME:-granada-buffer}
    volumes:
      - ./data:/data
      - ./iniciar_osrm.sh:/opt/vec/iniciar_osrm.sh:ro
    command: ["personalizar"]
    depends_on:
      osrm-partition:
        condition: service_completed_successfully

  osrm:
    image: ${OSRM_IMAGE:-osrm/osrm-backend:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/vec/iniciar_osrm.sh"]
    environment:
      OSRM_DATA_BASENAME: ${OSRM_DATA_BASENAME:-granada-buffer}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data:ro
      - ./iniciar_osrm.sh:/opt/vec/iniciar_osrm.sh:ro
    command: ["servir"]
