# Propuesta de observabilidad de PostgreSQL para la principal de VEC.
# NO APLICADA. Instrucciones y riesgos en postgresql_observabilidad.md.
#
# Se incluye desde postgresql.conf con:
#   include_if_exists = 'vec_observabilidad.conf'
#
# shared_preload_libraries NO va aquí: hay que AÑADIR pg_stat_statements y
# auto_explain al valor que ya tenga el servidor, sin sustituirlo (ver el
# paso 2 del documento). Eso y pg_stat_statements.max exigen reiniciar; el
# resto se aplica con SELECT pg_reload_conf().

# --- Requiere reinicio ---
pg_stat_statements.max = 10000

# --- Estadísticas por consulta y por función ---
compute_query_id = on
pg_stat_statements.track = top          # 'all' mide también lo que ejecutan las funciones por dentro
pg_stat_statements.track_utility = off
pg_stat_statements.save = on
track_functions = 'all'                 # tiempos por función en pg_stat_user_functions
track_io_timing = on                    # tiempo de lectura de disco en los planes y estadísticas
track_activity_query_size = 4096

# --- Consultas lentas en el registro de PostgreSQL ---
log_min_duration_statement = '300ms'    # mismo umbral que el registro de acceso de VEC
log_parameter_max_length = 0            # no escribir los valores de $1, $2… (datos personales)
log_parameter_max_length_on_error = 0
log_error_verbosity = terse             # sin DETAIL, HINT ni contexto, que pueden llevar valores
log_lock_waits = on                     # esperas por bloqueo más largas que deadlock_timeout
deadlock_timeout = '1s'
log_temp_files = '10MB'
log_autovacuum_min_duration = '1s'
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d app=%a '

# --- Plan de las consultas muy lentas (auto_explain) ---
# Desactivado: auto_explain.log_min_duration = -1. Se enciende a mano y por
# poco tiempo (ver el documento), porque un plan puede mostrar valores.
auto_explain.log_min_duration = -1
auto_explain.log_analyze = on
auto_explain.log_timing = off           # el detalle de tiempos por nodo cuesta mucho
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on # VEC trabaja dentro de funciones
auto_explain.log_format = 'json'
auto_explain.log_parameter_max_length = 0
auto_explain.sample_rate = 1
