worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    limit_conn_zone $binary_remote_addr zone=conexiones_proxy_corporativo:1m;

    log_format estructurado escape=json
        '{"instante":"$time_iso8601","remoto":"$remote_addr",'
        '"metodo":"$request_method","ruta":"$uri","estado":$status,'
        '"bytes":$body_bytes_sent,"duracion":$request_time}';
    access_log /dev/stdout estructurado;
    error_log /dev/stderr warn;

    upstream presentacion_privada {
        server proxy-presentacion:8080;
        keepalive 8;
    }

    server {
        listen 8080 ssl default_server;
        server_name _;

        # Certificado autofirmado generado con
        # scripts/generar_certificado_presentacion_remota.sh, fuera de Git.
        # El proxy corporativo debe confiar en él de forma explícita
        # (fingerprint o CA propia); no es un certificado público.
        ssl_certificate /etc/nginx/certs/servidor.crt;
        ssl_certificate_key /etc/nginx/certs/servidor.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache shared:presentacion_remota:2m;

        # La ACL montada falla cerrada en el repositorio y sólo se sustituye en
        # el despliegue. No se confía en X-Forwarded-For para esta decisión.
        include /etc/nginx/acceso-remoto.conf;

        client_max_body_size 2m;
        limit_conn conexiones_proxy_corporativo 20;

        # El healthcheck nace dentro del propio contenedor. No debe depender de
        # las credenciales interactivas que pueda exigir la ACL operativa, pero
        # tampoco queda expuesto al proxy corporativo ni a otros equipos.
        # Comprueba además el salto siguiente: un Nginx vivo sin portal
        # alcanzable no se considera saludable. Interroga /livez porque el
        # portal reserva /healthz y /readyz para la disponibilidad de sus
        # dependencias, que esta entrada no gobierna ni debe exigir.
        location = /healthz {
            auth_basic off;
            allow 127.0.0.1;
            allow ::1;
            deny all;

            proxy_pass http://presentacion_privada/livez;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-Forwarded-Tls-Client-Cert "";
            proxy_set_header X-VEC-Subject "";
            proxy_set_header X-VEC-Roles "";
            proxy_set_header X-VEC-Auth-Mechanism "";
            proxy_set_header X-Auth-Subject "";
            proxy_set_header X-Auth-Token "";
            proxy_set_header X-Auth-Roles "";
            proxy_set_header X-Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header Remote-User "";
            proxy_hide_header Set-Cookie;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_next_upstream off;
            access_log off;
        }

        location / {
            proxy_pass http://presentacion_privada;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";

            # Este salto no autentica. Elimina cualquier credencial o aserción
            # aportada por el proxy exterior antes de entrar en la demo.
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Server "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-Forwarded-Tls-Client-Cert "";
            proxy_set_header X-VEC-Subject "";
            proxy_set_header X-VEC-Roles "";
            proxy_set_header X-VEC-Auth-Mechanism "";
            proxy_set_header X-Auth-Subject "";
            proxy_set_header X-Auth-Token "";
            proxy_set_header X-Auth-Roles "";
            proxy_set_header X-Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header Remote-User "";
            proxy_hide_header Set-Cookie;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
    }
}
