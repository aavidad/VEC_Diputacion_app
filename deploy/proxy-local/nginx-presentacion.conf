worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Docker resuelve los módulos opcionales en tiempo de petición. De este
    # modo, la ausencia de Dietas/cartografía no impide arrancar el portal de
    # Contratación temporal y Bolsas.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=cartografia_por_ip:1m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=teselas_por_ip:1m rate=60r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:1m;
    # Los rechazos por frecuencia no deben elevar a warn una URI de tesela.
    limit_req_log_level notice;

    log_format estructurado escape=json
        '{"instante":"$time_iso8601","remoto":"$remote_addr",'
        '"metodo":"$request_method","ruta":"$uri","estado":$status,'
        '"bytes":$body_bytes_sent,"duracion":$request_time}';
    access_log /dev/stdout estructurado;
    error_log /dev/stderr warn;

    upstream portal_presentacion {
        server vec-api:8080;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        server_name "";
        return 444;
    }

    server {
        listen 8080;
        # La IP privada sólo existe en la red Docker de borde y permite que las
        # herramientas efímeras de smoke/captura alcancen el mismo proxy sin
        # usar la red del anfitrión.
        server_name 127.0.0.1 localhost 192.168.255.194;
        client_max_body_size 2m;
        limit_conn conexiones_por_ip 20;

        # Los módulos y activos locales se cargan en paralelo. El borde sólo
        # publica loopback y ya limita conexiones/recursos del contenedor; un
        # limitador global rompería la carga legítima. Las superficies con
        # coste variable conservan sus límites específicos más abajo.

        # La presentación interna no utiliza cookies. El borde las descarta en
        # cada upstream para que nunca alcancen a la aplicación. No se rechaza
        # toda la navegación porque 127.0.0.1 puede conservar cookies ajenas de
        # otros servicios locales; ese estado ambiental se ignora, no se acepta.

        # Superficie cartografica de demostracion: una única operación, sin
        # identidad ni efectos administrativos. Las coordenadas viajan en el
        # cuerpo y nunca forman parte del registro del proxy.
        location = /api/presentacion/cartografia/rutas {
            limit_except POST { deny all; }
            client_max_body_size 64k;
            limit_req zone=cartografia_por_ip burst=10 nodelay;

            set $mediador_cartografico
                http://vec-cartografia-presentacion:8080;
            proxy_pass $mediador_cartografico;
            proxy_http_version 1.1;
            proxy_set_header Host vec-cartografia-presentacion;
            proxy_set_header Connection "";

            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-VEC-Subject "";
            proxy_set_header X-VEC-Roles "";
            proxy_set_header X-VEC-Auth-Mechanism "";
            proxy_set_header X-Auth-Subject "";
            proxy_set_header X-Auth-Roles "";
            proxy_set_header X-Remote-User "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;

            add_header Cache-Control "private, no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 20s;
            proxy_send_timeout 10s;
            proxy_next_upstream off;
        }

        location ~ "^/tiles/osm/(?<osm_z>(?:[0-9]|1[0-4]))/(?<osm_x>[0-9]{1,6})/(?<osm_y>[0-9]{1,6})\.png$" {
            limit_except GET HEAD { deny all; }
            limit_req zone=teselas_por_ip burst=120 nodelay;

            set $teselas_internas http://tiles-osm-presentacion:8080;
            proxy_pass $teselas_internas/styles/osm-granada/256/$osm_z/$osm_x/$osm_y.png;
            proxy_http_version 1.1;
            proxy_set_header Host tiles-osm.local;
            proxy_set_header Connection "";

            # La cartografia base nunca recibe identidad ni contexto de la
            # comision de servicio.
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;

            add_header Cache-Control "private, no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
            access_log off;
            error_log /dev/stderr crit;
        }

        location /tiles/osm/ {
            access_log off;
            log_not_found off;
            error_log /dev/stderr crit;
            add_header Cache-Control "private, no-store" always;
            return 404;
        }

        location / {
            proxy_pass http://portal_presentacion;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # El proxy de presentacion no autentica ni acepta aserciones del
            # navegador. La raiz RRHH continúa siendo el artefacto sintetico
            # aislado y no autoritativo.
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-VEC-Subject "";
            proxy_set_header X-VEC-Roles "";
            proxy_set_header X-VEC-Auth-Mechanism "";
            proxy_set_header X-VEC-Display-Name "";
            proxy_set_header X-VEC-Email "";
            proxy_set_header X-VEC-DNI "";
            proxy_set_header X-Auth-Subject "";
            proxy_set_header X-Auth-Token "";
            proxy_set_header X-Auth-Mechanism "";
            proxy_set_header X-Auth-Assurance "";
            proxy_set_header X-Auth-Roles "";
            proxy_set_header X-Auth-Role "";
            proxy_set_header X-Auth-Display-Name "";
            proxy_set_header X-Auth-Name "";
            proxy_set_header X-Auth-Email "";
            proxy_set_header X-Auth-DNI "";
            proxy_set_header X-Auth-NIF "";
            proxy_set_header X-Remote-User "";
            proxy_set_header Remote-User "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-Forwarded-Tls-Client-Cert "";
            proxy_hide_header Set-Cookie;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
