worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=peticiones_por_ip:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:1m;

    log_format estructurado escape=json
        '{"instante":"$time_iso8601","remoto":"$remote_addr",'
        '"metodo":"$request_method","ruta":"$uri","estado":$status,'
        '"bytes":$body_bytes_sent,"duracion":$request_time}';
    access_log /dev/stdout estructurado;
    error_log /dev/stderr warn;

    server {
        listen 8080 default_server;
        server_name "";
        return 444;
    }

    server {
        listen 8080;
        server_name 127.0.0.1 localhost;
        client_max_body_size 2m;
        limit_req zone=peticiones_por_ip burst=40 nodelay;
        limit_conn conexiones_por_ip 20;

        location / {
            proxy_pass http://vec-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # El proxy local no autentica. Elimina cualquier asercion aportada
            # por el cliente para que nunca se convierta en identidad interna.
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-VEC-Subject "";
            proxy_set_header X-VEC-Roles "";
            proxy_set_header X-VEC-Auth-Mechanism "";
            proxy_set_header X-VEC-Display-Name "";
            proxy_set_header X-VEC-Email "";
            proxy_set_header X-VEC-DNI "";
            proxy_set_header X-Auth-Subject "";
            proxy_set_header X-Auth-Token "";
            proxy_set_header X-Auth-Mechanism "";
            proxy_set_header X-Auth-Assurance "";
            proxy_set_header X-Auth-Roles "";
            proxy_set_header X-Auth-Role "";
            proxy_set_header X-Auth-Display-Name "";
            proxy_set_header X-Auth-Name "";
            proxy_set_header X-Auth-Email "";
            proxy_set_header X-Auth-DNI "";
            proxy_set_header X-Auth-NIF "";
            proxy_set_header X-Remote-User "";
            proxy_set_header Remote-User "";
            proxy_set_header Forwarded "";
            proxy_set_header Via "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Client-Cert "";
            proxy_set_header X-Forwarded-Tls-Client-Cert "";
            # Segunda barrera: aunque el servicio aguas arriba se configure mal,
            # este proxy de presentacion nunca entrega cookies al cliente.
            proxy_hide_header Set-Cookie;

            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
