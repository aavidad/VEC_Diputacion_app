# Fragmento para incluir dentro del `server` HTTPS autenticado del portal
# interno. El puerto 8091 permanece en loopback y nunca se expone a clientes.

location ~ "^/tiles/osm/(?<osm_z>(?:[0-9]|1[0-4]))/(?<osm_x>[0-9]{1,6})/(?<osm_y>[0-9]{1,6})\.png$" {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:8091/tiles/osm/$osm_z/$osm_x/$osm_y.png;
    proxy_http_version 1.1;
    proxy_set_header Host tiles-osm.local;
    proxy_set_header Connection "";

    # La cartografia base no recibe identidad, cookies ni datos del expediente.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;

    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;

    # Las teselas no son evidencia administrativa y su registro por unidad
    # genera metadatos y volumen sin valor probatorio.
    access_log off;
}

# Cualquier variante no canonica falla cerrada; no se reenvia al portal.
location /tiles/osm/ {
    return 404;
}
