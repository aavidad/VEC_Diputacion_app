worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 8080 default_server;
        server_name _;

        location ~ "^/tiles/osm/(?<osm_z>(?:[0-9]|1[0-4]))/(?<osm_x>[0-9]{1,6})/(?<osm_y>[0-9]{1,6})\.png$" {
            limit_except GET HEAD { deny all; }

            set $renderer_osm tiles-osm:8080;
            proxy_pass http://$renderer_osm/styles/osm-granada/256/$osm_z/$osm_x/$osm_y.png;
            proxy_http_version 1.1;
            proxy_set_header Host tiles-osm.local;
            proxy_set_header Connection "";

            # Nunca se propaga identidad ni contexto del expediente al mapa.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;

            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;

            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            return 404;
        }
    }
}
