# Imágenes de la capa de supervisión (M0), fijadas por digest de índice
# multiplataforma. Formato: VARIABLE=registro/imagen@sha256:... (shell).
# La etiqueta de origen y la versión se anotan en el comentario de cada línea.
# Actualizar: descargar la etiqueta, anotar el nuevo digest, repetir
# scripts/probar_presupuesto_supervision.sh piloto y el inventario de licencias.

# zabbix/zabbix-server-pgsql:alpine-7.0-latest -> Zabbix 7.0.31, Alpine 3.24.2
