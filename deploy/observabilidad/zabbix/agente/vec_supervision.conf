# Agente 2 de supervisión VEC: permisos mínimos por clave (M0).
#
# El agente ve el host por /proc (pid y red del host) y los contenedores
# leyendo sus ficheros cgroup v2 montados de solo lectura en /host/cgroup.
# NO se monta el socket de podman/docker: ese socket concede control total del
# motor aunque se monte «ro».
#
# Las reglas se evalúan en orden y gana la primera coincidencia:
#   1. se niega cualquier ruta con «..» (recorrido fuera de /host/cgroup);
#   2. se permite leer únicamente bajo /host/cgroup;
#   3. se niega el resto de lecturas de ficheros y directorios;
#   4. se niega la ejecución de órdenes (system.run).
# Probado con «zabbix_agent2 -t»: /host/cgroup/../../etc/passwd -> no admitida.
DenyKey=vfs.file.contents[*..*]
DenyKey=vfs.file.regexp[*..*,*]
DenyKey=vfs.dir.get[*..*,*]
AllowKey=vfs.file.contents[/host/cgroup/*]
AllowKey=vfs.file.regexp[/host/cgroup/*,*]
AllowKey=vfs.dir.get[/host/cgroup/*,*]
DenyKey=vfs.file.*[*]
DenyKey=vfs.dir.*[*]
DenyKey=system.run[*]
