# Integracion continua: ejecuta la puerta de calidad canonica del proyecto
# (scripts/verificar_calidad.sh) en cada push y pull request. Las acciones se
# fijan por SHA de commit, igual que las imagenes del Dockerfile se fijan por
# digest.
name: ci

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

# Un push nuevo en la misma rama cancela la ejecucion anterior: el canal de
# direccion produce varios commits seguidos y solo interesa el ultimo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puerta-secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la historia necesaria para auditar el envio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rechazar secretos en los commits nuevos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  puerta-calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: vecsilencio contrasta su línea base con la del
          # punto de bifurcación de la rama base (git merge-base).
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar la toolchain Go declarada en go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Instalar Node para las pruebas web
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Aprovisionar el ZIP OSM de la Release publica
        run: scripts/aprovisionar_cartografia_osm.sh
      - name: Puerta de calidad
        run: scripts/verificar_calidad.sh
      # El conductor O3a V5 (runner endurecido) queda fuera del CI por la
      # moratoria de INSTRUCCIONES_DESATASCO.md (3 de septiembre): basta
      # go test ./... con el arnes existente. El codigo sigue en tools/.

  puerta-artefactos-productivos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aprovisionar el ZIP OSM de la Release publica
        run: scripts/aprovisionar_cartografia_osm.sh
      - name: Verificar ZIP e indice OSM antes de empaquetar
        run: scripts/verificar_manifiestos_superficies_web.sh
      - name: Construir las superficies productivas separadas
        run: |
          docker build --target runtime-publico -t vec-ci-publico:revision .
          docker build --target runtime-interno -t vec-ci-interno:revision .
      - name: Verificar inventarios y fallo cerrado
        run: |
          scripts/verificar_contenido_artefactos_productivos.sh \
            vec-ci-publico:revision vec-ci-interno:revision
          scripts/probar_fallo_cerrado_artefactos_productivos.sh \
            vec-ci-publico:revision vec-ci-interno:revision

  puerta-postgresql-contexto-actor-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probar el registro ContextoActor/PDP V3 en PostgreSQL 18
        env:
          VEC_POSTGRES_TEST_IMAGE: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        run: bash deploy/postgresql/autorizacion/probar_integracion_contexto_actor_v3.sh

  puerta-postgresql-bolsa-publica:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar la toolchain Go declarada en go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Probar la proyeccion publica de Bolsa en PostgreSQL 18 con TLS
        env:
          VEC_POSTGRES_TEST_IMAGE: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        run: bash deploy/postgresql/bolsa_publica/probar_integracion.sh
