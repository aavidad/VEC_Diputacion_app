services:
  vec-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vec-diputacion-granada:local
    environment:
      VEC_HTTP_ADDR: ":8080"
      VEC_AUTH_MODE: "trusted_headers"
      VEC_BOLSA_STORAGE_MODE: "local_durable"
      VEC_BOLSA_DATA_DIR: "/data/bolsa"
      VEC_TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128,172.16.0.0/12"
    ports:
      - "8080:8080"
    volumes:
      - ./var/bolsa:/data/bolsa
    profiles:
      - local
