services:
  vec-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vec-diputacion-granada:local
    environment:
      VEC_HTTP_ADDR: ":8080"
      VEC_AUTH_MODE: "disabled"
      VEC_BOLSA_STORAGE_MODE: "local_durable"
      VEC_BOLSA_DATA_DIR: "/data/bolsa"
      VEC_BOLSA_PUBLIC_SOURCE_PATH: "/app/data/demo/convocatorias_publicas.demo.json"
      # Solo el proxy local, con direccion fija en la red interna, puede entrar.
      VEC_TRUSTED_PROXY_CIDRS: "${VEC_PROXY_INTERNAL_ADDRESS:-192.168.255.242}/32"
      VEC_HTTP_ALLOWED_CIDRS: "${VEC_PROXY_INTERNAL_ADDRESS:-192.168.255.242}/32"
    expose:
      - "8080"
    volumes:
      - vec-bolsa-datos:/data/bolsa
    networks:
      vec-interna:
        ipv4_address: "${VEC_API_INTERNAL_ADDRESS:-192.168.255.243}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    profiles:
      - local

  proxy-local:
    image: nginxinc/nginx-unprivileged:1.30.3-alpine@sha256:b3f2436575bd5be7386518084d842dac414ab4962712afa31e99e0942a56e3b2
    depends_on:
      - vec-api
    ports:
      - "127.0.0.1:${VEC_HTTP_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - ./deploy/proxy-local/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      vec-borde:
      vec-interna:
        ipv4_address: "${VEC_PROXY_INTERNAL_ADDRESS:-192.168.255.242}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0750,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    profiles:
      - local

networks:
  vec-borde:
    ipam:
      config:
        - subnet: "${VEC_DOCKER_EDGE_SUBNET:-192.168.255.248/29}"
          gateway: "${VEC_DOCKER_EDGE_GATEWAY:-192.168.255.249}"
  vec-interna:
    internal: true
    ipam:
      config:
        - subnet: "${VEC_DOCKER_SUBNET:-192.168.255.240/29}"
          gateway: "${VEC_DOCKER_GATEWAY:-192.168.255.241}"

volumes:
  vec-bolsa-datos:
