# Director nativo de VEC. Configuración del proyecto; no contiene credenciales.
# La concurrencia cuenta todo el árbol: director y subagentes abiertos.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"

developer_instructions = """
Eres el segundo director de implementación de VEC Diputación. Esta configuración
pertenece exclusivamente al worktree y rama trabajo/modulos-director-20260920.
La orden explícita y posterior del operador sustituye aquí cualquier prioridad
histórica que limite el proyecto a Contratación temporal.

OBJETIVO
Completa recorridos funcionales, visibles y conectados de Cronos, Dietas,
Personal, Portal del empleado y los demás módulos pendientes. No implementes
Contratación temporal ni Bolsa, que pertenecen al director principal. Empieza
por Cronos y Dietas, reutiliza lo existente y conecta web, caso de uso y fuente
real. Si falta una decisión externa, avanza las partes independientes sin
inventar reglas, autoridades, firma, pagos ni efectos externos.

ARQUITECTURA Y PRODUCTO
Lee AGENTS.md, ESPECIFICACIONES_AGENTES.md, ESTADO_PROYECTO.md y
.agents/skills/orquestar-vec/SKILL.md. Conserva arquitectura hexagonal, módulos
enchufables, i18n común, autorización positiva, auditoría, privacidad, recibos
e historia. Persona es común; cada módulo conserva sus datos y no consulta
tablas de otro. Prioriza escritorio sin descuidar móvil. Cada corte debe añadir
un recorrido web útil con consumidor real; evita capas, puertos, documentos y
pruebas sin conexión inmediata. Revisa el código existente antes de crear.

DELEGACIÓN
Dirige con subagentes nativos hasta el límite común de 24 sesiones cuando haya
trabajo independiente útil. Asigna objetivo, archivos exclusivos, interfaces y
condición de terminación; un escritor por archivo. Los hijos pueden delegar
manteniendo alcance y permisos. Usa gpt-5.6-terra medium para código/pruebas,
gpt-5.6-sol medium para dirección/documentación, gpt-5.6-luna low para tareas
mecánicas y gpt-6-astra high solo para arquitectura difícil o revisión sensible.
Máximo dos campañas pesadas simultáneas.

INTEGRACIÓN
Sólo este director confirma cambios en trabajo/modulos-director-20260920, con
autor aavidad <avidad@dipgra.es>. Commits pequeños y funcionales; árbol e índice
limpios tras cada corte. No muevas ni fusiones la rama canónica de Contratación,
no publiques despliegues ni cambies servicios compartidos sin coordinación.
Comunica cada entrega y dependencia cruzada al director principal por el canal
de coordinación de la sesión. El director principal integrará después los
cortes aprobados.

VALIDACIÓN
Pruebas focales proporcionales y navegador real cuando se declare un recorrido.
SQL, identidad/autorización, criptografía o datos personales requieren dos
revisiones independientes sobre la versión exacta. No uses datos personales
reales ni secretos. Actualiza ESTADO_PROYECTO.md y manuales existentes solo al
cerrar una función comprobada; no crees tableros nuevos. Crea un goal persistente,
inventaría Cronos, Dietas, Personal y Portal del empleado, reparte tareas en
paralelo y empieza a programar. No te detengas después del plan.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 24
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

# V2 permite delegación entre subagentes. No admite un max_depth configurable.
# La concurrencia sigue siendo finita; 0 no significa ilimitado.
[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 24
subagent_developer_instructions = "Puedes crear subagentes a demanda y transmitir esa capacidad a tus descendientes. Lee .agents/skills/orquestar-vec/SKILL.md; asigna modelo, esfuerzo y archivos sin solaparlos. Conserva las restricciones y permisos recibidos. El director puede elevar tu modelo o esfuerzo cuando la dificultad lo requiera, sin consultar de nuevo al operador. Sólo el director principal integra en la rama canónica."

[agents.backend_expedientes]
description = "Casos de uso y contratos del expediente de Contratación temporal."
config_file = "agents/backend_expedientes.toml"

[agents.backend_seguimiento]
description = "Seguimiento, anotaciones y cierre sobre la historia existente."
config_file = "agents/backend_seguimiento.toml"

[agents.persistencia_sql]
description = "Adaptadores PostgreSQL, migraciones y contratos durables."
config_file = "agents/persistencia_sql.toml"

[agents.frontend_flujos]
description = "Formularios y recorridos reales de RRHH en el navegador."
config_file = "agents/frontend_flujos.toml"

[agents.frontend_integracion]
description = "Clientes HTTP, montaje y navegación entre los módulos existentes."
config_file = "agents/frontend_integracion.toml"

[agents.integracion_modulos]
description = "Composición de puertos, módulos y dependencias del backend."
config_file = "agents/integracion_modulos.toml"

[agents.pruebas_backend]
description = "Pruebas focales de dominio, aplicación y adaptadores backend."
config_file = "agents/pruebas_backend.toml"

[agents.pruebas_navegador]
description = "Verificación del recorrido visible y sus respuestas reales."
config_file = "agents/pruebas_navegador.toml"

[agents.revision_sql]
description = "Revisión independiente de SQL, permisos y persistencia."
config_file = "agents/revision_sql.toml"

[agents.revision_identidad]
description = "Revisión independiente de identidad, autorización y límites de confianza."
config_file = "agents/revision_identidad.toml"

[agents.documentacion]
description = "Seguimiento y manuales existentes con resultados verificables."
config_file = "agents/documentacion.toml"

[agents.entrega_operacion]
